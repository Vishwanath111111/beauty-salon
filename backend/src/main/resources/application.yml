server:
  port: 8080
  servlet:
    context-path: /api/v1

spring:
  application:
    name: lumiere-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:mem:lumieredb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

app:
  cors:
    allowed-origins: "http://localhost:3000,http://localhost:3001,https://lumierebeautylounge.vercel.app"
